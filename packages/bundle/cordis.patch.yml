# The dsh-prompt-optimizer bundle patch: stacked over a base-backed profile
# (`web`, `headless`, `sdk`, …). Later bundle patches and the user's own
# profile cordis.patch.yml address rows by id.
- insert:
    - id: prompt-optimizer
      name: '@yimiliya/dsh-prompt-optimizer'
    - id: api-prompt-optimizer
      name: '@yimiliya/dsh-api-prompt-optimizer'
    - id: ui-prompt-optimizer
      name: '@yimiliya/dsh-client-ui-prompt-optimizer'

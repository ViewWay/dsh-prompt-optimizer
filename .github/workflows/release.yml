name: Publish to npm

# Fires on a release tag (v*) push. All four packages must carry the tagged
# version (the workflow verifies it) and stay in sync with each other.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # docs/compatibility.md is the source of truth for this tag.
      - name: Fetch the dsh harness sources
        run: |
          mkdir -p .tmp
          git clone --depth 1 --branch dsh-v0.2.1-rc.2 \
            https://github.com/deepseek-ai/deepseek-harness.git .tmp/dsh-harness

      - name: Install harness dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .tmp/dsh-harness

      - name: Test
        run: DSH_HARNESS_ROOT=$PWD/.tmp/dsh-harness pnpm run test

      - name: Verify every package version matches the tag
        run: |
          TAG="${{ github.ref_name }}"
          FAIL=0
          for pkg in packages/*/package.json; do
            VER="v$(node -p "require('./$pkg').version")"
            if [ "$TAG" != "$VER" ]; then
              echo "::error::$pkg version $VER does not match tag $TAG"
              FAIL=1
            fi
          done
          exit $FAIL

      # Publishes the four public packages in workspace dependency order
      # (host -> api -> client -> bundle); the private root is skipped.
      # Requires the NPM_TOKEN repository secret with publish rights.
      - name: Publish all packages
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
